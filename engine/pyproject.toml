[project]
name = "engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2",
  "cryptography>=43", "httpx>=0.27", "pydantic-settings>=2.4", "pandas>=2.2",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.setuptools]
packages = ["app", "metrics", "connectors", "worker", "seed"]
[tool.pytest.ini_options]
testpaths = ["tests"]
